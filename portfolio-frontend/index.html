<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#087f70" />

  <title>Roshan Bendugade | Java Full Stack Developer</title>
  <meta
          name="description"
          content="Roshan Bendugade - Java full stack developer. Portfolio, projects and blog."
  />

  <!-- Link previews (LinkedIn, WhatsApp, X). Replace YOUR-DOMAIN.com after you deploy. -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Roshan Bendugade | Java Full Stack Developer" />
  <meta
          property="og:description"
          content="I build scalable web applications with Java, Spring Boot, React and MySQL."
  />
  <meta property="og:url" content="https://YOUR-DOMAIN.com" />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <script>
    try {
      var saved = localStorage.getItem("theme");
      var dark = saved
        ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.classList.add("dark");
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"
  />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
